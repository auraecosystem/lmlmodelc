[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmlmodelc"
version = "0.1.0"
description = "Local-first native language model architecture and runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
lmlmodel = "lmlmodel.cli:main"

[tool.setuptools.packages.find]
include = ["lmlmodel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
